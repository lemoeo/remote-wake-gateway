services:
  gateway:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    image: remotewake-gateway:local
    network_mode: host
    user: "${RWG_UID:-10001}:${RWG_GID:-10001}"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ../../data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/v1/readyz]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
