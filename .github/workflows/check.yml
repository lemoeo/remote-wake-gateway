name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: sh scripts/check.sh
      - run: RWG_SKIP_WEB=1 sh scripts/build.sh
      - name: Compile Linux targets
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/gateway-amd64 ./cmd/remotewake-gateway
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/gateway-arm64 ./cmd/remotewake-gateway
